<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<title>US Short Put Report — NVDA — 2026-09-20</title>
<meta name="description" content="Short Put screening report including NVDA"/>
<!-- Short Put | NVDA | gzip parts b0..b8 -->
</head><body>
<p>Loading Short Put report (NVDA)…</p>
<script>
(async()=>{
  const n=9;
  const parts=await Promise.all([...Array(n)].map((_,i)=>
    fetch('b'+i+'.txt').then(r=>{if(!r.ok)throw new Error(i+':'+r.status);return r.text();})
  ));
  const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
  const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<pre>Failed: '+e+'\nOpen via raw.githack or jsDelivr.</pre>';});
</script>
<noscript>Enable JS for Short Put (NVDA) report.</noscript>
</body></html>
