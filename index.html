<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美股 Short Put 篩選 · 載入中…</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{max-width:28rem;padding:1.5rem;text-align:center}
.err{color:#fca5a5;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box" id="status">載入完整互動報告中…</div>
<script>
(async () => {
  const status = document.getElementById('status');
  const files = ['b0.txt','b1.txt','b2.txt','b3.txt','b4.txt'];
  try {
    const parts = [];
    for (const f of files) {
      const r = await fetch(f + '?t=' + Date.now());
      if (!r.ok) throw new Error('fetch ' + f + ' → ' + r.status);
      parts.push(await r.text());
    }
    const b64 = parts.join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    status.className = 'box err';
    status.textContent = '載入失敗：' + e + '\n\n可改試 jsDelivr：https://cdn.jsdelivr.net/gh/tracyng95/us-short-put@main/index.html';
  }
})();
</script>
</body>
</html>
