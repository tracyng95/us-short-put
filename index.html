<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美股 Short Put · 2026-09-20 (loading…)</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0b1220;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  #s{text-align:center;padding:2rem}
  .spin{width:40px;height:40px;border:3px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:r .8s linear infinite;margin:0 auto 1rem}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="s"><div class="spin"></div><p>Loading Short Put report 2026-09-20…</p><p id="m" style="opacity:.7;font-size:.9rem"></p></div>
<script>
(async () => {
  const N = 9;
  const msg = (t) => { const e = document.getElementById('m'); if (e) e.textContent = t; };
  try {
    const parts = [];
    for (let i = 0; i < N; i++) {
      msg(`Fetching chunk ${i + 1}/${N}…`);
      const r = await fetch(`b${i}.txt`);
      if (!r.ok) throw new Error(`b${i}.txt HTTP ${r.status}`);
      parts.push(await r.text());
    }
    msg('Decompressing…');
    const bin = Uint8Array.from(atob(parts.join('')), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    msg('Failed: ' + err.message);
    console.error(err);
  }
})();
</script>
</body>
</html>
